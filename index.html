<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #0f1026;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .pad-container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 650px;
    }
    @media (max-width: 500px) {
      .pad-container {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .pad-btn {
      background: linear-gradient(180deg, #181938 0%, #101124 100%);
      border: 1.5px solid rgba(99, 102, 241, 0.35);
      border-radius: 18px;
      height: 115px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #f8fafc;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      transition: transform 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pad-btn:active, .pad-btn.active {
      transform: scale(0.92);
      border-color: #ff7b00;
      box-shadow: 0 0 25px rgba(255, 123, 0, 0.85);
      background: linear-gradient(180deg, #262450 0%, #ff7b00 100%);
    }
    .pad-icon {
      font-size: 34px;
    }
    .pad-name {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .pad-key {
      font-size: 9px;
      color: #94a3b8;
      background: rgba(10, 10, 20, 0.8);
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-family: monospace;
    }
  </style>
</head>
<body>

  <div class="pad-container">
    <button class="pad-btn" id="kick" onclick="playKick()">
      <span class="pad-icon">🥁</span>
      <span class="pad-name">Bumbo (Kick)</span>
      <span class="pad-key">Tecla [1]</span>
    </button>

    <button class="pad-btn" id="snare" onclick="playSnare()">
      <span class="pad-icon">💥</span>
      <span class="pad-name">Caixa (Snare)</span>
      <span class="pad-key">Tecla [2]</span>
    </button>

    <button class="pad-btn" id="hihat" onclick="playHiHat()">
      <span class="pad-icon">✨</span>
      <span class="pad-name">Chimbal (Hi-Hat)</span>
      <span class="pad-key">Tecla [3]</span>
    </button>

    <button class="pad-btn" id="tom" onclick="playTom()">
      <span class="pad-icon">🪘</span>
      <span class="pad-name">Tom Rítmico</span>
      <span class="pad-key">Tecla [4]</span>
    </button>
  </div>

  <script>
    let audioCtx = null;
    function getCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function triggerEffect(id) {
      const el = document.getElementById(id);
      if (el) {
        el.classList.add('active');
        setTimeout(() => el.classList.remove('active'), 100);
      }
    }

    function playKick() {
      triggerEffect('kick');
      const c = getCtx(), t = c.currentTime, osc = c.createOscillator(), gain = c.createGain();
      osc.frequency.setValueAtTime(150, t);
      osc.frequency.exponentialRampToValueAtTime(0.01, t + 0.4);
      gain.gain.setValueAtTime(1, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(t);
      osc.stop(t + 0.4);
    }

    function playSnare() {
      triggerEffect('snare');
      const c = getCtx(), t = c.currentTime;
      const b = c.createBuffer(1, c.sampleRate * 0.2, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const n = c.createBufferSource(); n.buffer = b;
      const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1000;
      const ng = c.createGain();
      ng.gain.setValueAtTime(0.8, t);
      ng.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
      n.connect(f); f.connect(ng); ng.connect(c.destination);

      const osc = c.createOscillator(), og = c.createGain();
      osc.type = 'triangle'; osc.frequency.setValueAtTime(180, t);
      og.gain.setValueAtTime(0.7, t);
      og.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
      osc.connect(og); og.connect(c.destination);
      n.start(t); osc.start(t); n.stop(t + 0.2); osc.stop(t + 0.1);
    }

    function playHiHat() {
      triggerEffect('hihat');
      const c = getCtx(), t = c.currentTime;
      const b = c.createBuffer(1, c.sampleRate * 0.05, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const s = c.createBufferSource(); s.buffer = b;
      const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
      const g = c.createGain();
      g.gain.setValueAtTime(0.6, t);
      g.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
      s.connect(f); f.connect(g); g.connect(c.destination);
      s.start(t); s.stop(t + 0.05);
    }

    function playTom() {
      triggerEffect('tom');
      const c = getCtx(), t = c.currentTime, osc = c.createOscillator(), gain = c.createGain();
      osc.frequency.setValueAtTime(220, t);
      osc.frequency.exponentialRampToValueAtTime(80, t + 0.35);
      gain.gain.setValueAtTime(0.9, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.35);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(t);
      osc.stop(t + 0.35);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === '1') playKick();
      if (e.key === '2') playSnare();
      if (e.key === '3') playHiHat();
      if (e.key === '4') playTom();
    });
  </script>
</body>
</html>
